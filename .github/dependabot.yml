version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    groups:
      web-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Must match the Node.js major used locally and in CI.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Major compiler upgrade: revisit when the Vite react-ts template adopts it.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
